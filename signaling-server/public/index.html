<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola de Administración - Control Remoto</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background-color: var(--card);
            padding: 20px;
            border-radius: 12px;
            min-width: 150px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--text-muted);
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th {
            background-color: rgba(255,255,255,0.05);
            font-weight: 600;
            color: var(--text-muted);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            margin-right: 8px;
            box-shadow: 0 0 8px var(--success);
        }
    </style>
</head>
<body>

    <h1>Consola de Administración</h1>
    <div class="subtitle">Monitoreo de equipos en línea en tiempo real</div>

    <div class="stats">
        <div class="stat-card">
            <h3>Conexiones Totales</h3>
            <div class="value" id="total-count">0</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID Conexión</th>
                <th>Estado</th>
                <th>Sala (Room)</th>
                <th>Hora de Conexión</th>
            </tr>
        </thead>
        <tbody id="device-list">
            <tr>
                <td colspan="4" style="text-align: center; color: var(--text-muted);">Esperando dispositivos...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const socket = io();
        const tbody = document.getElementById('device-list');
        const countEl = document.getElementById('total-count');

        socket.on('devices-update', (devices) => {
            countEl.textContent = devices.length;
            
            if (devices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #94a3b8;">No hay dispositivos conectados.</td></tr>';
                return;
            }

            tbody.innerHTML = devices.map(d => `
                <tr>
                    <td><span style="font-family: monospace;">${d.id}</span></td>
                    <td><span class="status-dot"></span>${d.status}</td>
                    <td><strong>${d.roomId || '-'}</strong></td>
                    <td>${new Date(d.connectedAt).toLocaleTimeString()}</td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
